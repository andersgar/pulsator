; Pulsator firmware: pump (relay) + WS2812B strip + piezo, controlled from a
; phone over the ESP32's own hotspot.
; Board: ESP32 devkit (ESP32-D0WD) with CH340 USB-serial.

[env:esp32dev]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder, default
; No fixed COM port: find_port.py locates the CH340 by USB id at upload time and
; the monitor auto-detects the same device. See README.md.
extra_scripts = pre:find_port.py
lib_deps =
    fastled/FastLED@^3.9.13
build_flags =
    -DCORE_DEBUG_LEVEL=1
